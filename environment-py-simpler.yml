name: sctools-py
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - nodejs>=18.0.0
  - pip>=23.0
  
  # Core scientific stack
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scipy
  
  # Jupyter and interactive
  - jupyterlab
  - ipywidgets
  - ipykernel
  - nb_conda_kernels
  
  # Data formats and storage
  - h5py
  - pytables
  - xarray
  - zarr
  
  # Parallelization
  - dask
  - dask-core
  
  # AWS and cloud
  - boto3
  - s3fs
  - awscli
  - google-cloud-storage
  
  # Single-cell and spatial
  - anndata
  - scanpy
  - networkx
  
  # Performance
  - numba
  - tqdm
  - cython
  
  # Visualization
  - plotly
  - bokeh
  - holoviews
  - folium
  
  # Data processing
  - statsmodels
  - patsy
  - sympy
  - scikit-image
  
  # Geospatial
  - geopandas
  - shapely
  - rtree
  
  # R integration
  - rpy2
  
  # Image processing
  - pillow
  - imageio
  - tifffile
  
  # HTTP and APIs
  - requests
  - aiohttp
  
  # File formats
  - pyarrow
  - yaml
  - pyyaml
  - fsspec
  
  # pip packages
  - pip:
    # Machine learning
    - torch
    - torchvision
    - tensorboard
    - flax
    - jax
    - lightning
    - optax
    
    # Single-cell and spatial
    - scvi-tools
    - squidpy
    - leidenalg
    - louvain
    - omnipath
    - gseapy
    - spatialdata
    - spatialdata-io
    - biothings-client
    - harmonypy
    
    # Image analysis
    - cellpose
    - darwin-py
    - opencv-python-headless
    - simpleitk
    
    # Data formats
    - loompy
    - mudata
    - readfcs
    - anndata2ri
    - flowio
    - ome-zarr
    - ome-types
    
    # AWS
    - aiobotocore
    
    # NLP
    - spacy
    
    # Utilities
    - simplejson
    - pydantic
    - typer
    - typed-ast
    - mpire
    - beartype